name: "Findings by Project"
category: assessment  # Current state: shows today's findings inventory regardless of time period
nav_category: Investigation
chart_libraries: []
template: "findings_by_project.html"
description: "Comprehensive inventory of findings across projects with optional filtering (project, folder, component, exploit maturity)"
execution_order: 20  # Reuses cached scans from Scan Analysis
auto_run: false  # Run explicitly with --recipe when needed

query:
  endpoint: "/public/v0/findings"
  params:
    limit: 10000
    filter: ""

# Project list query for discovery
project_list_query:
  endpoint: "/public/v0/projects"
  params:
    limit: 10000
    archived: false

transform_function: findings_by_project_pandas_transform
output:
  table: true
  formats:
    - csv
    - xlsx
    - html
    - json
    - md
  charts: []
  # Per-column documentation. Renderers (xlsx Schema sheet, HTML/MD banner)
  # source descriptions from here so customers can read what each column
  # means without opening fs-report source code. Adding a new output column
  # should add an entry here in the same PR.
  columns:
    - name: "CVE ID"
      source: "API /findings: cve_id"
      description: "The CVE identifier (e.g. CVE-2024-12345)."
    - name: "Severity"
      source: "API /findings: severity"
      description: "Platform severity tier (critical / high / medium / low / info)."
    - name: "CVSS"
      source: "API /findings: risk (rescaled 0–100 → 0–10)"
      description: "CVSS base score on the standard 0.0–10.0 scale, as scored by the platform. It is not derived from the CVSS Vector column: that vector is whichever version NVD published, so the score and the vector beside it can be from different scoring versions."
    - name: "KEV"
      source: "API /findings: inKev (boolean)"
      description: "\"Yes\" if listed in CISA's Known Exploited Vulnerabilities catalog."
    - name: "Project Name"
      source: "API /findings: project.name"
      description: "Display name of the Finite State project the finding belongs to."
    - name: "Project Version"
      source: "API /findings: projectVersion.version"
      description: "Version label for that project."
    - name: "Folder"
      source: "API /folders: name (joined via project.folderId)"
      description: "Folder the project lives in, or empty for projects at the root."
    - name: "Component Group"
      source: "Derived from component.purl namespace"
      description: "Group / namespace portion of the component PURL (e.g. \"@scope\" for npm)."
    - name: "Component"
      source: "API /findings: component.name"
      description: "Component the CVE was identified against."
    - name: "Component Version"
      source: "API /findings: component.version"
      description: "Version of that component as detected by the scan."
    - name: "Status"
      source: "API /findings: status"
      description: "Triage status (AFFECTED / NOT_AFFECTED / IN_TRIAGE / FALSE_POSITIVE / RESOLVED / RESOLVED_WITH_PEDIGREE)."
    - name: "Reachability"
      source: "API /findings: reachabilityScore"
      description: "REACHABLE / UNREACHABLE / INCONCLUSIVE / UNKNOWN, derived from the platform's reachability analysis (binary scans only)."
    - name: "Detected"
      source: "API /findings: detected"
      description: "ISO-8601 timestamp when the platform first detected this finding."
    - name: "Exploit Maturity"
      source: "API /findings: exploitMaturity"
      description: "Single maturity tier string for this CVE: \"poc\" (proof exists) or \"weaponized\" (working, often productized exploit). Empty if no exploit reference is known. Matches the platform GUI's columns.exploitMaturity export."
    - name: "# exploit signal categories"
      source: "API /findings: len(exploitInfo)"
      description: "Count of distinct exploit-related signal *categories* the platform has observed for this CVE — drawn from VulnCheck maturity tiers, availability flags, KEV listings, and in-the-wild exploitation reports. This is NOT a per-source exploit-reference count; it tops out around 7–9 even for the most-exploited CVEs. The accurate per-source count (matching the platform UI's \"Exploits\" tab) requires per-CVE enrichment and is tracked as a follow-up."
    - name: "# in-the-wild exploitation signals"
      source: "API /findings: count of exploitInfo tokens matching botnet/ransomware/threat/actor"
      description: "Number of in-the-wild exploitation signals on this CVE — incremented per matching token (named-adversary, ransomware family, or botnet exploitation report). Does NOT count the weaponized maturity tier; see Exploit Maturity for that. A CVE with Exploit Maturity = weaponized can have this value = 0 if no named adversary is yet attributed."
    - name: "CWE"
      source: "API /findings: cwes[0]"
      description: "Primary CWE identifier (e.g. CWE-79)."
    - name: "Description"
      source: "Joined NVD enrichment"
      description: "CVE description from NVD when enrichment is available, otherwise empty."
    - name: "CVSS Version"
      source: "The CVSS: prefix of the CVSS Vector column; a prefix-less value reads 2 only when NVD published it in the v2 field"
      description: "Which CVSS scoring version the vector on this row was published under: 4.0, 3.1, 3.0 or 2. The CVSS: prefix was introduced with v3, so a vector without one shows as 2, provided the value came from NVD's v2 metrics. Empty when NVD has no vector for the CVE, and when the printed vector carries no readable version: a prefix-less value in the v3/v4 field, a prefixed value NVD published as v2, a CVSS: that does not lead the string, or an unparseable prefix. A blank cell means no readable scoring, never an assumed one. It describes the vector in the CVSS Vector column; it does not describe the Attack Vector label in the one case where that label took its label from the next candidate on the row's ranked list, so on such a row the three cells are not all one scoring. A CVSS major this column has never seen is reported as published rather than blanked, so a future 5.x vector shows its own number. Rendered as a coloured pill in HTML (blue for 2, orange for 3.x, lavender for 4, neutral for an unrecognized major) and as the plain number in CSV, XLSX, JSON and Markdown."
    - name: "Attack Vector"
      source: "Parsed from the AV: metric of a published CVSS vector for the CVE"
      description: "How remote the attack is: Network, Adjacent, Local or Physical, read from the AV: field of the vector string in the CVSS Vector column. A v2 vector gives a coarser label: v2 has no Physical value and scores physical access as Local. If the vector in that column carries no readable AV: metric, the label is read from the next candidate on the row's ranked list instead of being left blank — usually an older version's vector, but a demoted one when the printed vector came from a lower-ranked field. That is the one case where the label can differ from the vector shown beside it. Empty when no vector for the CVE carries a readable AV: metric."
    - name: "CVSS Vector"
      source: "Joined NVD enrichment — newest version scored: v4, else v3, else v2"
      description: "The newest CVSS vector string NVD published for the CVE: v4 if the CVE was scored under v4, otherwise v3, otherwise v2. Where NVD holds several scorings of one version, NVD's own is preferred over a CNA-supplied one. Passed through as published apart from trimmed surrounding whitespace, so the version is readable off the value — v4 and v3 carry a CVSS:4.0/ or CVSS:3.1/ prefix, while a v2 vector has no prefix and carries an Au: (Authentication) metric. NVD publishes base metrics only, so the temporal metrics (E:, RL:, RC:) shown alongside a vector in the platform UI are not part of this value. A value has to carry at least one CVSS metric field to count as a vector, so a placeholder (n/a, unknown, -, a bare CVSS:3.1) is never printed as one. A vector with a readable version also outranks one without, so a v2-shaped string mis-filed into the v4 field loses to the correctly filed v3 vector NVD sent alongside it; a value with no readable version is demoted, never dropped, and still prints when it is the only one NVD sent. Among vectors that do declare a version, the newest declared version wins whatever field it arrived in, so a CVSS:3.0/… value mis-filed into the v4 field loses to a correctly filed CVSS:3.1/… one; field order only breaks a tie between equal versions. A vector is still taken at its word about its own version — that misfiled value reports 3.0, not 4.0 — because the vector text is the more specific statement and the field assignment is the part this code cannot see. Empty when NVD has no vector for the CVE, when NVD enrichment is unavailable, or when the finding is not a CVE (GHSA and PYSEC advisories are not looked up)."
    - name: "CVSS v3 Vector"
      source: "NVD enrichment cvss_v3_vector field, under its pre-2.0.6 header"
      description: "DEPRECATED, removed in 3.0.0. Only a vector that declares itself CVSS:3.x, so a consumer parsing it as a CVSS:3.x string is never handed a v2 or v4 one — including one misfiled into the v3 field, which reads blank rather than passing through. Blank when NVD published no v3 scoring, including the v2-only CVEs the CVSS Vector column now fills, and still the v3 vector when a v4 scoring exists and wins that column. Placeholders are the one old behaviour not reproduced. Move to CVSS Vector plus CVSS Version for the newer versions. CSV, XLSX and JSON only — HTML shows the renamed column, and the Markdown findings table never carried a vector column in a shipped release."
    - name: "NVD URL"
      source: "Constructed from CVE ID"
      description: "Direct link to the CVE on https://nvd.nist.gov."
    - name: "FS Link"
      source: "Constructed from project / version / finding IDs"
      description: "Deep link to the finding in the Finite State platform UI."
    - name: "dependency_path"
      source: "Computed from project dependency expansion (conditional column)"
      description: "Project dependency chain (e.g. \"ProjectA -> ProjectB\"). Only present when the target project has cross-project dependency expansion enabled; absent otherwise."
    - name: "component_dependency_path"
      source: "Computed from project + component dependency expansion (conditional column)"
      description: "Full path including the component (e.g. \"ProjectA -> ProjectB -> openssl 1.1.1\"). Only present when the target project has cross-project dependency expansion enabled; absent otherwise."